<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Unai Garay Maestre</title>
    <meta name="robots" content="noindex" />
    <link
      rel="icon"
      type="image/png"
      href="/images/unai-favicon.png"
      sizes="180x180"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --accent: #2fb3b3;
        --accent-hot: #64eaea;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(
            50rem 34rem at 18% 10%,
            rgba(47, 179, 179, 0.12),
            transparent 60%
          ),
          radial-gradient(
            44rem 30rem at 84% 82%,
            rgba(70, 100, 200, 0.1),
            transparent 62%
          ),
          #0b0d0f;
        color: #e8ecee;
        font-family: "Outfit", system-ui, sans-serif;
        font-weight: 300;
        text-align: center;
      }
      .code {
        color: var(--accent);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      h1 {
        margin-top: 0.8rem;
        color: #fff;
        font-size: clamp(2rem, 7vw, 3.2rem);
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      p {
        margin-top: 0.9rem;
        color: #a2acb0;
        font-size: 1.05rem;
      }
      a.home {
        display: inline-flex;
        margin-top: 2rem;
        padding: 0.7em 1.5em;
        background: var(--accent);
        border-radius: 999px;
        color: #04191a;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s ease;
      }
      a.home:hover {
        background: var(--accent-hot);
      }
    </style>
  </head>
  <body>
    <main>
      <p class="code">Error 404</p>
      <h1>This page doesn't exist</h1>
      <p>The link may be old, or I may have moved something.</p>
      <a class="home" href="/">Back to the homepage</a>
    </main>
  </body>
</html>
